# Miliastra 最小启动配置
# 本文件只保留启动引导所需的三个段：database_path、http、logging。
# 旧版完整配置（window/screen/ocr/templates 等全部功能段）不再从本文件读取，
# 升级时请删除旧段、只保留以下三个引导段；其余配置保存在统一数据库
# playback.sqlite3 中，通过 Web 面板（http.port）的“配置中心”页面查看与修改。
# 保留旧段会导致启动解析失败（未知字段被严格拒绝）。

# 统一数据库路径（相对主程序所在目录）；存放配置、播放状态、队列、缓存索引、歌词
database_path: deps/data/playback.sqlite3

# Web 面板/配置中心
http:
  enabled: true
  host: 127.0.0.1
  port: 18888
  # access_token 留空默认本机免鉴权；非本机监听时必须设置
  access_token: ""

# 日志（日志初始化在数据库打开之前，必须留在引导配置）
logging:
  dir: deps/logs
  level: info
  rotate_daily: true
  retain_days: 7
