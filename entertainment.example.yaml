idiom_chain:

  # 是否启用项目内置成语词库的接龙功能
  enabled: true

  # 成语词库路径；相对路径以主程序 EXE 所在目录为基准
  lexicon_path: assets/idioms.txt

  # 最多保留多少个最近成语用于会话历史；本局完整已用集合始终禁止重复
  history_limit: 200

  # 多久无人接词就自动结束本局；0 表示不超时，单位秒
  idle_timeout_seconds: 300

  # false 时开局玩家不能连续接词
  allow_consecutive_player: false

  # false 时仅开局玩家可使用 #结束
  allow_anyone_stop: false

landlord:

  # 三名好友参与的单局斗地主娱乐模块
  enabled: true

  # 等待三人组局的最长时间
  lobby_timeout_seconds: 120

  # 每名玩家的出牌时间
  turn_timeout_seconds: 90

  # 连续超时多少次后进入自动托管
  trustee_after_timeouts: 2

  # 好友私聊 #手牌 的单人查询冷却
  hand_cooldown_seconds: 10

# 谁是卧底默认关闭；启用前复制 undercover.example.yaml 为 undercover.yaml 并审核词对
undercover:
  enabled: false
  word_bank_path: undercover.yaml
  used_state_path: data/undercover-used.yaml
  min_players: 4
  double_min_players: 6
  max_players: 11
  lobby_timeout_seconds: 180
  phase_timeout_seconds: 180

  # 投票阶段公布未投票位置的间隔，单位秒
  progress_interval_seconds: 20

  # 单条公屏 #内容 的最大显示宽度
  description_max_width: 70

turtle_soup:

  # 海龟汤娱乐模块默认关闭；启用前必须准备正式题库并配置独立 AI Provider
  enabled: false

  # 正式题库由使用者维护，不随仓库提交；格式参考 turtle_soup.example.yaml
  question_bank_path: turtle_soup.yaml

  # 永久已使用题目记录；程序不提供重置接口，只能手动修改此文件
  used_state_path: data/turtle-soup-used.json

  # 进行中多久没有新问题就自动结束，单位秒
  idle_timeout_seconds: 600

  # 单局最长时间，单位秒
  max_session_seconds: 3600

  # AI 同时裁决的最大请求数
  max_concurrency: 4

  # 除正在裁决外，最多等待多少条问题
  max_pending: 32

  # 单个昵称的一份批量长答案最多暂存多少段；每段仍受游戏聊天长度限制
  batch_max_parts: 32

  # 昵称 OCR 连续确认次数；大于 1 时覆盖全局值，0 或 1 表示继承
  nickname_stable_count: 0

  # 正文 OCR 连续确认次数；大于 1 时覆盖全局值，0 或 1 表示继承
  content_stable_count: 0

  # 单次 AI 请求超时，单位秒
  request_timeout_seconds: 20

  # 单次裁决请求失败后的重试次数；实际最多请求 retry_count + 1 次
  retry_count: 2

  # AI 请求重试间隔，单位毫秒
  retry_delay_ms: 500

  # 附加在固定裁决提示词后的房间规则；不要要求模型输出自由解释或汤底
  custom_prompt: |
    裁决备注若以“主持裁决：问题=结果”的形式明确列出标准问法，语义等价的玩家问题优先遵循该结果。
    对裁决备注没有列出的问法，严格使用内置的互斥裁决协议，只判断本次问题，不自行放宽“相容近似”或“完全正确”的范围。

  # 海龟汤默认使用 OpenAI Chat Completions；优先选择高能力模型，保证复杂逻辑整理质量
  ai:

    # OpenAI 官方完整 Chat Completions 地址
    endpoint: "https://api.openai.com/v1/chat/completions"

    # 填写 OpenAI API Key；不要提交到 Git
    api_key: ""

    # 高能力模型；请求只发送 OpenAI 标准 Chat Completions 字段
    model: "gpt-5.6"

    # 可选的独立 HTTP(S) 代理；留空时沿用环境代理设置
    http_proxy: ""

    # 单次裁决允许生成的最大 Token；复杂裁决使用更充足的 JSON 输出空间
    # 程序按 OpenAI Chat Completions 的 max_tokens 字段发送
    max_tokens: 1024

    extra_body:
      # 全部字段默认 null = 不发送；需要时改为具体值即可。
      # 只能补充字段，和官方字段同名时官方值优先。
      # 字段均来自各家官方 API 文档：
      #
      # OpenAI / 通用 OpenAI 兼容网关（platform.openai.com）：
      reasoning_effort: null  # 推理强度：none/minimal/low/medium/high/xhigh/max
      service_tier: null      # 服务等级：auto/default/flex/scale/priority/fast
      safety_identifier: null # 滥用检测标识，≤64 字符（替代已废弃的 user）
      prompt_cache_key: null  # 缓存优化键（替代 user）
      metadata: null          # 附加元数据，最多 16 对；键 ≤64、字符串值 ≤512 字符
      seed: null              # 确定性采样（Beta）
      verbosity: null         # 回复详略：low/medium/high
      #
      # DeepSeek（api-docs.deepseek.com）：
      #   reasoning_effort 取值：low/high/max（medium/xhigh 按 high 处理）
      #   注意：thinking 必须是对象 {"type": "enabled"|"disabled"}，写布尔 true/false 会被 API 400 拒绝
      thinking: null          # 思考模式开关：{"type": "enabled"|"disabled"}（默认 enabled）
      user_id: null           # 自定义用户 ID：仅 [a-zA-Z0-9-_]，≤512 字符
      #
      # 阿里云百炼 qwen 系列（help.aliyun.com）：
      enable_thinking: null   # 混合思考模式开关：true/false
      #
      # OpenRouter（openrouter.ai/docs）：
      provider: null          # 供应商路由偏好：{"order": [...], "allow_fallbacks": true, ...}