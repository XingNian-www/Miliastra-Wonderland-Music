[package]
name = "miliastra-login-helper"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
miliastra-login-protocol = { workspace = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2"
qrcode = { version = "0.14", default-features = true }
reqwest = { workspace = true, features = ["blocking", "json", "query", "rustls"] }
rumqttc = { version = "0.25.1", features = ["websocket"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "miliastra-login-helper"
path = "src/main.rs"
