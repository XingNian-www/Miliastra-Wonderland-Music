name: 质量门禁与 Windows 构建

# 这个 workflow 把原先「Linux 质量门禁」与「构建 Windows EXE」两个 workflow 合成一个。
#
# 为什么合并：一次 push 同时触发两个 workflow，Actions 页会出现两条并列的 run，
# 同一次提交的结论分散在两处；而它们本来就该是同一条流水线——门禁不过就不该占用
# Windows runner。现在：一次 push = 一个 run，`build-windows-exe` 通过 `needs`
# 挂在三个 Linux 门禁之后，门禁红掉时 Windows 构建直接 skipped。
#
# 触发策略（两套条件取并集，但**只有一个 run**）：
#   * Linux 三个门禁（web-build / repo-scripts / rust-gate）：每次 push / PR 都跑；
#   * Windows 构建（version-gate → build-windows-exe）：只在 Cargo.toml 或 web/ 变动、
#     或本 workflow 自身变动时**才**执行实际构建（version-gate 的 gate 逻辑决定）。
#     普通代码提交会跑 Linux 门禁，Windows job 由 `if` 判定跳过，不浪费 windows runner。
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本，例如 v6.2.0；带 -dev 时只构建不发布（如 v6.2.0-dev）。留空时使用 Cargo.toml 版本。
        required: false
        type: string

# 顶层只读：Linux 三个门禁与 version-gate 都不需要写。只有真正建 Release / 传产物的
# `build-windows-exe` 那个 job 单独放宽到 `contents: write`（最小权限）。
permissions:
  contents: read

# 同一分支的新运行取代旧运行：push 按分支名分组，PR 按 PR 号分组。
# 既避免同分支并发跑多份门禁互相拖慢，也避免旧提交的绿灯盖住新提交。
#
# `cancel-in-progress` 只在 **PR** 上开启：合并前的反复推送本来就该互相取代。
# 在 `main` 上必须关掉——合并后每次推送都会触发一次完整 Windows 构建（十几分钟），
# 若被后一次推送取消，就会出现「提交 A 的构建被取消、提交 B 的构建成功」，
# 而那正是发版提交本身，等于发版产物凭空消失。宁可两个都跑完。
concurrency:
  group: quality-gate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Cargo.lock 里有 git 依赖（rust-paddle-ocr 锁定在 tag v2.3.1）：走 git CLI 拉取，
  # Swatinem/rust-cache 的 git 依赖缓存才能命中。
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

  # ---- 以下为 Windows 构建专用（Linux job 不需要，见各自 job 的注释）----
  # Windows 预编译依赖的路径变量。原先放在仓库的 `.cargo/config.toml` 里 `[env]`，
  # 但 cargo 的 `[env]` 对**所有 target** 生效且不支持按 target 限定
  # （`[target.'cfg(windows)'.env]` 会被判为 unused key），于是 Linux 门禁也会读到
  # 指向 Windows 目录的 FFMPEG_DIR，ffmpeg-sys-next 因此不再走 pkg-config，
  # `cargo test` 链接阶段直接红。改用「谁需要谁导出」的方式：只在 Windows 构建里给，
  # Linux 那边保持不设，让它正常走 pkg-config。
  # 用 `${{ github.workspace }}` 展开成绝对路径（顶层 env 允许 github 上下文）。
  # OCR 源码与模型固定到 Cargo.lock 锁定的提交。
  # 下载步骤另外校验 SHA-256，确保模型内容符合预期。
  # OpenVINO 运行时、FP32 IR 与许可证直接使用仓库已发布的成品运行时包
  # （build-windows-openvino 工作流的 Release 资产），主发布流程不再下载官方
  # runtime、安装 OpenVINO Python 或转换 ONNX，从而缩短构建时间并避免外部依赖抖动。

jobs:
  # ===========================================================================
  # 门禁一：前端构建
  #
  # 必须独立成 job，不要和 Rust 门禁挤进同一个脚本：GitHub Actions 的 `run:` 以
  # `bash -e` + `set -eo pipefail` 执行，`cd web && npm ci && npm run build` 之后
  # 如不显式 cd 回来，同一脚本里后面的 `cargo ...` 会继续在 web/ 下执行，
  # 直接报 "could not find Cargo.toml"。分开写也让 Rust job 在前端失败时直接跳过。
  # ===========================================================================
  web-build:
    name: 前端构建（web/dist）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 门禁只读当前提交，不需要历史。
          fetch-depth: 1

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 与 build-windows-exe job 保持一致，避免本地与发版构建出现 Node 版本差异。
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖并构建面板
        # working-directory 优于在脚本里 cd：每一步起点明确，不会把当前目录泄漏给后续步骤。
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 校验产物
        # build.rs 以 web/dist/index.html 作为“面板产物就绪”的唯一判据；
        # 缺它就是发布出没有面板的 exe。把判据前移到这里，失败信息更直接。
        run: |
          test -f web/dist/index.html
          ls -la web/dist

  # ===========================================================================
  # 门禁二：仓库脚本（分层方向 / 日志文案 / 面板 API 覆盖 / 入库边界）
  #
  # 全部只读 src/、web/src/、scripts/，不碰网络、不碰工具链，
  # 因此单独成一个 job 与 Rust 门禁并发跑，反馈更快。
  # ===========================================================================
  repo-scripts:
    name: 代码规范与脚本门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      # 不往仓库里写 __pycache__（这些都是单文件脚本，字节码缓存没有收益）。
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 分层方向检查
        # 只允许上层依赖下层；规则在 scripts/layer-policy.json，违规时退出码 1 并打印反向边。
        #
        # 必须带 `--check`：不带参数时脚本走 `--report`（W0 引入 allowlist 制后的默认），
        # 只打印现状、**永远退出 0**。曾经 CI 这一步就是这样空转的——层边与预算
        # 早已升级为可阻断的 allowlist，但 CI 还在用旧的报告模式。
        run: python3 scripts/check-layers.py --check

      - name: 日志文案检查
        # 禁止 {:?} 调试格式、字段堆砌、全英文消息等；规则见 technical-docs/logging-style.md。
        run: python3 scripts/check-log-style.py

      - name: 面板 API 覆盖率
        # 解析 src/interfaces/http/protocol.rs 的路由表 vs web/src 里的 URL 字面量。
        # 脚本约定“退出码恒 0，仅用于报告”，所以这里显式把「未覆盖 > 0」判成失败：
        # 面板字段是前后端冻结契约，路由加了却没人调，等于面板功能静默缺失。
        run: |
          set -euo pipefail
          report=$(python3 scripts/panel-api-coverage.py)
          printf '%s\n' "$report"
          missing=$(printf '%s\n' "$report" | sed -n 's/.*未覆盖 \([0-9][0-9]*\) 个.*/\1/p' | tail -n 1)
          [ -n "$missing" ] || { echo "::error::无法从 panel-api-coverage.py 输出解析未覆盖数，脚本输出格式可能已变"; exit 1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::面板 API 覆盖率未满：$missing 条 Rust 路由前端未调用（路由表与 web/src 不同步）"
            python3 scripts/panel-api-coverage.py --json
            exit 1
          fi

      # 隐私扫描不放在这个 job：见 rust-gate 末尾“隐私扫描”一步的说明。
      - name: 入库边界检查（technical-docs 不得入库）
        # technical-docs/ 整个目录被 .gitignore 忽略（隐私红线：测试图与真实帧只本地保留）。
        # 这里确认它没有被误加进索引；命中即失败。
        run: |
          if git ls-files --error-unmatch technical-docs >/dev/null 2>&1; then
            echo "::error::technical-docs/ 不应被提交（隐私红线：测试图与真实帧只本地保留）"
            exit 1
          fi
          echo "technical-docs/ 未纳入索引，符合预期"

      # ---- 前端单元测试（node:test，零依赖）-----------------------------------
      # 放在 repo-scripts 而不是 web-build：这里不装依赖、不构建，`node --test` 只用
      # Node 内置模块，几秒钟就能给出结果，失败原因也比「构建失败」精确得多。
      # 用例全部在 web/src/**（web/ 是入库目录；tests/ 在本仓库是符号链接且被 gitignore 挡住，
      # 往那里写测试既不入库、还会写到主检出目录去）。
      - name: 安装 Node（单元测试用）
        uses: actions/setup-node@v4
        with:
          # 与 web-build 保持一致：测试跑在与构建相同的运行时上才有意义。
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 前端单元测试（node --test）
        working-directory: web
        run: |
          set -euo pipefail
          # 先确认测试文件真的存在。`node --test` 在「一个测试文件都没找到」时是
          # 静默通过（退出码 0）——不挡住这一条，这个门禁就会退化成永远绿灯的摆设。
          mapfile -t test_files < <(find src -type f -name '*.test.mjs' | sort)
          [ "${#test_files[@]}" -gt 0 ] || {
            echo "::error::web/src 下没有找到任何 *.test.mjs，前端单元测试实际上没有执行"
            exit 1
          }
          printf '发现 %d 个前端测试文件：\n' "${#test_files[@]}"
          printf '  %s\n' "${test_files[@]}"
          # 这一步**不装 node_modules**，所以测试链路上不能出现任何来自
          # `dependencies` 的 import（`vue`、`pinia` 等）。2026-11-23 首次真跑时就踩了：
          # `util/configSchema.js` 从 `../store.js` 引 `nestedGet`，而 `store.js` 依赖
          # `vue`，于是测试文件在**模块加载阶段**就 ERR_MODULE_NOT_FOUND，
          # 本地因装过依赖而完全看不出来。下面的探针把这条约束变成可执行检查。
          # 只检查 `util/` 下的纯逻辑模块：它们必须能被无依赖加载。
          # `composables/`、`pages/` 是 Vue 组件，本来就该用 store，不在约束内。
          if grep -rn "store\.js'" src/util --include='*.js' --include='*.mjs' 2>/dev/null; then
            echo "::error::web/src/util 下不得依赖 store.js（它 import vue，CI 未装依赖）"
            exit 1
          fi
          # 用 runner 自身的递归发现（Node 20 起支持），不要依赖 shell glob：
          # CI 的 bash 默认没有 globstar，`src/**/*.test.mjs` 在子目录上匹配不到。
          node --test

  # ===========================================================================
  # 门禁三：Rust（格式 / 检查 / 单元测试 + clippy 报告）+ 隐私扫描
  #
  # 两处“全局唯一”的配置集中在这里：
  #
  # 1) CARGO_HOME 指到 runner 的临时目录（`$RUNNER_TEMP/cargo-home`）。
  #    过去它指向 `/opt/quality-gate/cargo-home`，有两个问题：
  #      - `ubuntu-latest` 上 /opt 属于 root，runner 用户不可写，第一次写
  #        registry 就 Permission denied；
  #      - 注释当时声称这样能“屏蔽仓库内的 Windows 专用 [env]”，**这是错的**。
  #        CARGO_HOME 只改变 `$CARGO_HOME/config.toml` 的位置，cargo 仍会从工作区
  #        向上读 `.cargo/config.toml`，[env] 照样生效。
  #    真正的修法是把 Windows 专用变量从 `.cargo/config.toml` 挪走（已做：
  #    那个文件现在是空的，FFMPEG_DIR / MNN_* 由 build-windows-exe job 的 step env 提供）。
  #    这里保留一个临时 CARGO_HOME 只是为了缓存目录固定可复用，不再承担“隔离”职责。
  #    `--no-default-features` 关掉两个 OCR 后端，Linux 因此完全不需要 MNN / OpenVINO / nasm。
  #
  # 2) lld 链接。链接阶段是 Rust 门禁最慢的一环，统一换成 lld。RUSTFLAGS 只在 job 级设置，
  #    所有 cargo 调用看到同一组参数。rustup 默认工具链自带 rust-lld，GitHub 的 Ubuntu 基础
  #    镜像也有 ld.lld；`校验系统依赖` 一步会显式确认它的存在。
  # ===========================================================================
  rust-gate:
    name: Rust 门禁（fmt / check / test / clippy）
    runs-on: ubuntu-latest
    # 本地实测（Linux、--lib、--test-threads=1）：冷编译约 2.5 分钟，2332 个用例一轮 417 秒，
    # 整个 job 冷启动约 12 分钟；rust-cache 命中后编译阶段基本消失。45 分钟的余量足够覆盖
    # runner 抖动与串行用例变慢，又不至于让真卡死的运行占满赛道。
    timeout-minutes: 45
    needs: web-build
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 门禁用不到历史：cargo fmt/check/test 与隐私扫描都只看当前工作树。
          fetch-depth: 1

      # ---- 工具链 ----------------------------------------------------------
      # 注意 CARGO_HOME 不能写在 job 级 `env:`：`jobs.<job_id>.env` 的可用上下文里
      # **没有** `runner`（只有 github/needs/strategy/matrix/vars/secrets/inputs），
      # 写了 `${{ runner.temp }}` 会直接报表达式错误。改为在这里写进 $GITHUB_ENV，
      # 后续所有步骤（含 uses: 步骤）都能读到。
      - name: 初始化临时 CARGO_HOME
        run: |
          set -euo pipefail
          cargo_home="$RUNNER_TEMP/cargo-home"
          mkdir -p "$cargo_home"
          test -w "$cargo_home" || { echo "::error::$cargo_home 不可写"; exit 1; }
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$cargo_home"

      # 不给 toolchain 输入：仓库里有 rust-toolchain.toml（channel = 1.96.0，
      # components = rustfmt, clippy）。rustup 会按它自动安装并锁定版本，
      # CI 里不必重复写一遍版本号（写死反而会在改钉版本时悄悄失配）。
      # 注意：这里与 build-windows-*.yml 的 `dtolnay/rust-toolchain@1.96.0` 不同，是有意的：
      # 门禁的版本来源只认 rust-toolchain.toml，钉版本时两个工作流会一起跟随。
      - name: 安装 Rust（按 rust-toolchain.toml 钉版本）
        uses: dtolnay/rust-toolchain@stable

      - name: 校验 Rust 版本与组件
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          pinned=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$pinned" ] || { echo "::error::rust-toolchain.toml 里没有 channel"; exit 1; }
          rustc --version | grep -q "^rustc $pinned " \
            || { echo "::error::rust-toolchain.toml 钉定的版本没有生效"; exit 1; }
          for component in rustfmt clippy; do
            # `rustup component list --installed` 的输出带目标三元组，
            # 形如 `rustfmt-x86_64-unknown-linux-gnu`。
            # 旧写法 `grep -qx "$component"` 是整行精确匹配，永远不命中 —— 这一步
            # 只要跑到就必红。这里按「组件名 + 连字符或行尾」匹配，版本后缀
            # （如 `-x86_64-unknown-linux-gnu`）一并吃掉。
            rustup component list --installed | grep -Eq "^${component}(-|$)" \
              || { echo "::error::缺少 $component 组件（rustup component list --installed 里找不到 ${component}-*）"; exit 1; }
          done

      # ---- Linux 系统依赖 ---------------------------------------------------
      # 逐个确认过的清单（不是照搬）：
      #   - cpal -> alsa：编译期需要 libasound2-dev（pkg-config 探针），所有 target 都会编，
      #     `--lib` 也躲不掉；libasound2（运行时）随之装上；
      #   - ffmpeg-next -> ffmpeg-sys-next 9.0：`--no-default-features` 只关掉 OCR，
      #     miliastra-playback 仍依赖它；找不到系统 ffmpeg 时 build.rs 直接 exit(1)；
      #   - ffmpeg-sys-next -> bindgen 0.72：需要 libclang（预编译产物即可，不必装 clang 本体）；
      #   - aws-lc-sys（rustls 底层加密库，默认 target 也会编）：构建阶段用 cmake；
      #   - enigo 0.6 在 Linux 上是纯 Rust（不链接 libxdo）：不装 libxdo-dev。
      # 是否齐全用显式探针验证，避免 apt 失败或空 apt-get update 时静默放过。
      - name: 安装 Linux 构建依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            lld \
            libclang-dev \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev

      - name: 校验系统依赖
        run: |
          set -euo pipefail
          command -v pkg-config
          command -v cmake
          # `lld` 不是 GitHub Ubuntu 镜像的必备包：2026-11-23 首次真跑这个 workflow 时
          # 就在这一步因 `command -v ld.lld` 退出 1 而整 job 失败（此前 quality-gate
          # 在 main 上从未被触发过，所以这个假设一直没被验证）。必须显式装 `lld`。
          command -v ld.lld
          pkg-config --exists alsa
          pkg-config --exists libavcodec libavformat libavutil libswresample
          echo "libclang=$(ls /usr/lib/llvm-*/lib/libclang.so* | head -n 1)"

      # ---- 缓存 -------------------------------------------------------------
      # 缓存键由 action 自动组合：Rust 版本、锁文件哈希、环境与 RUSTFLAGS 等；
      # 额外的 key 前缀只用来隔离本工作流的缓存，不与 build-windows-* 混用。
      - name: 缓存 Cargo 构建
        uses: Swatinem/rust-cache@v2
        with:
          # 每行语义是 `<工作区目录> [-> <target 目录>]`。这里只需要一个工作区。
          # 旧写法还填了 `/opt/quality-gate/cargo-home` 一行 —— 那是 CARGO_HOME 的
          # 绝对路径，既不是工作区、也没有 `-> target`，action 解析不出任何东西，
          # 那条缓存项等于落空。CARGO_HOME 的缓存由 action 自己按 registry/git
          # 目录处理，不需要（也不能）在这里声明。
          workspaces: |
            . -> target
          key: linux-quality-gate

      # ---- 前端产物 ---------------------------------------------------------
      # build.rs 读 web/dist/index.html 生成 panel_assets.rs 并 include_str! 进库：
      # 产物缺失时只打一条 cargo:warning 并回退空表，**构建照样通过** —— 本地实测确认：
      # 缺产物时 cargo check 退出码 0，panel_assets.rs 只占 2 行，面板静默消失。
      # 真到发版才会发现，所以必须先让 web/dist 就绪，再跑任何 cargo 命令。
      # 这里重新构建而不是从 web-build 传 artifact：让 Rust job 自包含，
      # 用十几秒的 vite build 换掉一整套 upload/download-artifact，失败原因也更直观。
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端产物（web/dist）
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 校验前端产物
        run: test -f web/dist/index.html

      # ---- Rust 门禁 --------------------------------------------------------
      - name: 格式检查（cargo fmt --all --check）
        run: cargo fmt --all --check

      - name: 编译检查（cargo check --workspace --lib --no-default-features，零警告门禁）
        # Wave 4 已将 5 个工作区 crate 的 Linux 非测试库构建告警全部清零（src/lib.rs 仅对
        # all(not(windows), not(test)) 放过 Windows-only 生产入口的 dead_code，其余告警与
        # Windows 构建均严格检查）。这里通过 JSON 诊断精确统计工作区 crate 的 compiler-message
        # warning，在不改动 job 级 RUSTFLAGS（避免破坏 cargo test 缓存复用）的前提下强制 0 警告。
        run: |
          set -euo pipefail
          cargo check --locked --workspace --lib --no-default-features --message-format=json-diagnostic-rendered-ansi \
            | python3 -c '
          import json, sys
          warnings = []
          for line in sys.stdin:
              line = line.strip()
              if not line.startswith("{"):
                  continue
              event = json.loads(line)
              if event.get("reason") != "compiler-message":
                  continue
              msg = event.get("message") or {}
              rendered = msg.get("rendered") or ""
              if msg.get("level") == "warning":
                  warnings.append(rendered)
                  sys.stderr.write(rendered)
              elif msg.get("level") == "error":
                  sys.stderr.write(rendered)
          if warnings:
              sys.stderr.write(f"::error::workspace --lib 编译存在 {len(warnings)} 条告警，门禁要求零警告\n")
              sys.exit(1)
          print("workspace --lib 编译检查通过：0 警告")
          '

      - name: 单测（cargo test --workspace --lib --no-default-features）
        # 覆盖面的三处补充（B00-P1-6）：
        #   1) `--workspace`：workspace 有 5 个 member，旧命令只测根 crate，
        #      miliastra-kernel / miliastra-login-protocol / miliastra-playback 的
        #      `#[cfg(test)]` 一律不跑（对照上面的 check 本来就是 `--workspace`）。
        #   2) `--lib` 之外补 `-p miliastra-login-helper --bins`：这个 crate 只有
        #      `src/main.rs`（没有 lib 目标），`--lib` 永远碰不到它；它的单测挂在
        #      bin target 上，用 `--bins` 收。其余 crate 的 bin target 在 Linux 上
        #      有 `compile_error!`（产品只支持 Windows），所以**不能**全局加 `--bins`。
        #   3) `-- --test-threads=1` 是仓库既定用法（存在进程级 static），必须保留。
        run: |
          set -euo pipefail
          cargo test --locked --workspace --lib --no-default-features -- --test-threads=1
          cargo test --locked -p miliastra-login-helper --bins --no-default-features -- --test-threads=1

      - name: clippy（报告模式，不阻断）
        # 为什么是 report-only 而不是硬闸门：
        #   `cargo clippy --workspace --lib --no-default-features` 在 1.96.0 上
        #   实测有 100+ 条告警（collapsible_if / map-over-inspect / needless_borrow…），
        #   全在 `src/**` 与 `crates/**` —— 清零属于独立批量任务，本批次只做 CI 侧接线，
        #   不能顺手改业务代码（也避免把 clippy 变成长期红着的摆设）。
        #   真正的硬门禁是上一步的「零 warning `cargo check`」。
        # 这里仍然**执行**它，原因是：安装了 clippy 却从不运行（旧状态）时，
        #   - 新告警没有任何可见度；
        #   - `-D warnings` 级别的回归要等到有人手工跑才会发现。
        #   PR 上把结果落成 `::warning` 注释 + Job Summary，master/push 只留日志。
        #   告警数写进摘要，便于清零进度可量化（目标：把 count 降到 0 后改成 `-- -D warnings`）。
        continue-on-error: true
        run: |
          set -uo pipefail
          # continue-on-error 下不要 set -e：要让后面的统计照常跑完。
          log="${RUNNER_TEMP}/clippy-workspace-lib.log"
          cargo clippy --locked --workspace --lib --no-default-features --message-format=short \
            2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          warnings=$(grep -cE '^[^ ].*warning: ' "$log" || true)
          errors=$(grep -cE '^[^ ].*error(\[|:)' "$log" || true)
          echo "clippy 告警 $warnings 条、错误 $errors 条（lib target，--no-default-features）"
          {
            echo "### clippy（--workspace --lib）"
            echo ""
            echo "- 告警：**$warnings** 条"
            echo "- 错误：**$errors** 条"
            echo ""
            echo "报告模式：清零后应改成 \`cargo clippy ... -- -D warnings\` 并去掉 \`continue-on-error\`。"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=clippy 报告::clippy 退出码 $status（告警 $warnings 条）——本步骤不阻断，详细输出见日志 ${log}"
          fi

      # ---- 隐私扫描（需要远端身份映射，单独守卫）-----------------------------
      - name: 隐私扫描（scripts/privacy-filter.py --repo --check）
        # 必须在 cargo 之后：`--repo` 的扫描面包含 technical-docs/（本地工作树，带真实帧与报告），
        # 那是最可能命中的地方，也正是隐私红线最在意的地方。
        #
        # 这个脚本的映射只能从远端面板取（未配置时的默认地址是内网），GitHub 托管 runner
        # 访问不到，因此它实际有两条结局，不能笼统地“跑一下就算过”：
        #   - 退出码 1：可能是真有命中，也可能是取不到映射（后者是未捕获的 URLError
        #     traceback，而不是脚本文档里写的“退出码 2”——本地实测如此）；
        #   - 退出码 2：映射取到了但为空。
        # 所以只有“完全没有任何面板配置”时才显式跳过并告警，绝不冒充“零命中”。
        # 一旦配置了 MILIASTRA_PANEL_URL，失败就是真失败（红灯），不掩盖任何命中。
        env:
          MILIASTRA_PANEL_URL: ${{ secrets.MILIASTRA_PANEL_URL }}
          MILIASTRA_PANEL_TOKEN: ${{ secrets.MILIASTRA_PANEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MILIASTRA_PANEL_URL:-}" ]; then
            echo "::warning title=隐私扫描未执行::仓库未配置 MILIASTRA_PANEL_URL Secret，runner 访问不到内网面板；本次提交未做隐私扫描，本地仍须跑 scripts/privacy-filter.py --repo --check"
            exit 0
          fi
          python3 scripts/privacy-filter.py --repo --check

  version-gate:
    name: 判定版本与发布策略
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      create_release: ${{ steps.gate.outputs.create_release }}
      version: ${{ steps.gate.outputs.version }}
      zip_full: ${{ steps.gate.outputs.zip_full }}
      zip_basic: ${{ steps.gate.outputs.zip_basic }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 读取版本并判定构建/发布
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # 从 Cargo.toml 的 [package] 段读取 version。
          read_package_version() {
            local text="$1"
            local version
            version=$(printf '%s\n' "$text" | awk '
              /^\[package\][[:space:]]*$/ { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && /^[[:space:]]*version[[:space:]]*=/ {
                if (match($0, /"[^"]+"/)) {
                  print substr($0, RSTART + 1, RLENGTH - 2)
                  exit
                }
              }
            ')
            if [ -z "$version" ]; then
              echo "::error::无法从 Cargo.toml 读取 [package].version"
              exit 1
            fi
            printf '%s' "$version"
          }

          normalize_version() {
            local value="$1"
            value="${value#v}"
            value="${value#V}"
            printf '%s' "$value"
          }

          is_dev_version() {
            case "$1" in
              *-dev*) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_numeric_version() {
            [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          }

          emit() {
            local should_build="$1"
            local create_release="$2"
            local version="$3"
            {
              echo "should_build=$should_build"
              echo "create_release=$create_release"
              echo "version=v$version"
              echo "zip_full=miliastra-wonderland-music-windows-x64-openvino-v$version.zip"
              echo "zip_basic=miliastra-wonderland-music-windows-x64-mnn-v$version.zip"
            } >> "$GITHUB_OUTPUT"
            echo "判定结果: 版本=v$version 构建=$should_build 发布=$create_release"
          }

          validate_version() {
            local version="$1"
            case "$version" in
              ""|*[[:space:]]*)
                echo "::error::版本号不能为空且不能包含空白字符: '$version'"
                exit 1
                ;;
            esac
            # 严格白名单：只允许 `X.Y.Z` 或 `X.Y.Z-<预发布串>`，字符集限定在
            # 字母/数字/点/连字符。这条校验不是防手滑，而是**安全边界**：
            # version 会被下游步骤拼进 PowerShell 脚本（如
            # `.github/release-notes/${{ needs.version-gate.outputs.version }}.md`），
            # 只要有引号、分号、`$()`、反引号之类的字符就能越出字符串插进命令。
            # 下游同时已改成通过 step `env:` 传递（不再直接插值），这里是第二道。
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
              echo "::error::版本号格式非法: '$version'（只允许 X.Y.Z 或 X.Y.Z-预发布串，字符集 0-9 A-Z a-z . - ）"
              exit 1
            fi
          }

          cargo_version="$(read_package_version "$(cat Cargo.toml)")"
          validate_version "$cargo_version"

          # 手动触发与 push 使用同一套版本规则，避免意外发布。
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$(normalize_version "${INPUT_VERSION:-}")"
            if [ -z "$version" ]; then
              version="$cargo_version"
            fi
            validate_version "$version"
            if is_dev_version "$version"; then
              emit true false "$version"
            elif is_numeric_version "$version"; then
              emit true true "$version"
            else
              echo "::error::手动触发版本必须是纯数字 X.Y.Z 或带 -dev 的版本，当前为: $version"
              exit 1
            fi
            exit 0
          fi

          # push：只有版本号实际变化才构建；版本格式决定是否发布。
          version_changed=true
          if [ -z "${BEFORE_SHA:-}" ] || ! printf '%s' "$BEFORE_SHA" | grep -q '[^0]'; then
            echo "推送前提交未知或为首次推送，按版本变化处理"
          elif git fetch --no-tags --depth=1 origin "$BEFORE_SHA" >/dev/null 2>&1 \
            && old_cargo="$(git show "$BEFORE_SHA:Cargo.toml" 2>/dev/null)" \
            && old_version="$(read_package_version "$old_cargo")"; then
            if [ "$old_version" = "$cargo_version" ]; then
              version_changed=false
            fi
          else
            echo "::warning::无法读取推送前版本，按版本变化处理"
          fi

          if [ "$version_changed" = "false" ]; then
            echo "版本号未变化（$cargo_version），本次提交不构建"
            emit false false "$cargo_version"
            exit 0
          fi

          if is_numeric_version "$cargo_version"; then
            emit true true "$cargo_version"
          elif is_dev_version "$cargo_version"; then
            emit true false "$cargo_version"
          else
            echo "版本 $cargo_version 既不是纯数字版本也不是 -dev 版本，跳过自动构建"
            emit false false "$cargo_version"
          fi

  build-windows-exe:
    # 顶层是 `contents: read`（Linux 门禁不需要写）；发版构建要建 Release、传产物，
    # 因此在这个 job 上单独放宽。最小权限原则仍然成立。
    permissions:
      contents: write
    # 两个变体共用同一份构建逻辑，只有 OCR 后端与打包内容不同：
    # - openvino：默认特性，含 OpenVINO 运行时（识别更快、体积更大）
    # - mnn    ：--no-default-features --features ocr-mnn，只保留 MNN（体积更小）
    #
    # `needs` 挂上 Linux 三个门禁 job：同一次 push 只跑**一个** workflow、一个 run 页。
    # 「Linux 门禁没过就别浪费 Windows runner」由 DAG 表达，不必再写 if。
    name: 构建 Windows x64 EXE
    needs: [version-gate, web-build, repo-scripts, rust-gate]
    if: needs.version-gate.outputs.should_build == 'true'
    runs-on: windows-latest

    # Windows 专用环境变量**必须放 job 级**，不能放顶层 env：顶层 env 对本 workflow
    # 所有 job 生效，Linux 三个门禁也会读到指向 Windows 目录的 FFMPEG_DIR，
    # ffmpeg-sys-next 不再走 pkg-config，`cargo check/test` 直接红。
    # 合并两个 workflow 时我曾误放顶层，CI 立刻复现（Rust 零警告门禁失败）。
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      FFMPEG_DIR: ${{ github.workspace }}\vendor\ffmpeg\8.1\windows-x64
      MNN_INCLUDE_DIR: ${{ github.workspace }}\vendor\mnn\3.6.0\windows-x64\include
      MNN_LIB_DIR: ${{ github.workspace }}\vendor\mnn\3.6.0\windows-x64\lib
      OCR_MODEL_BASE_URL: https://raw.githubusercontent.com/zibo-chen/rust-paddle-ocr/7368dfa292ab988e8431de4ec952f015bec40635/models
      OPENVINO_RUNTIME_RELEASE_TAG: v4.1.0-openvino
      OPENVINO_RUNTIME_ASSET: miliastra-wonderland-music-openvino-runtime-windows-x64-v4.1.0.zip
      OPENVINO_RUNTIME_URL: https://github.com/XingNian-www/Miliastra-Wonderland-Music/releases/download/v4.1.0-openvino/miliastra-wonderland-music-openvino-runtime-windows-x64-v4.1.0.zip
      OPENVINO_RUNTIME_SHA256: b829a123f24fb44143a7be912e0dfba5f739f8d924b2f01543083ff6f49db500
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc-release

      - name: 安装 PE 导入表检查工具
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-binutils

      - name: 解析 PE 导入表检查工具路径
        shell: msys2 {0}
        run: |
          objdump_path="$(command -v objdump)"
          test -x "$objdump_path"
          echo "OBJDUMP=$(cygpath -w "$objdump_path")" >> "$GITHUB_ENV"

      - name: 缓存 OpenVINO 成品运行时包
        uses: actions/cache@v5
        with:
          path: .build/openvino-runtime.zip
          key: openvino-runtime-package-${{ env.OPENVINO_RUNTIME_RELEASE_TAG }}-v1

      - name: 下载并解压 OpenVINO 成品运行时包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE '.build\openvino-runtime.zip'
          $extract = Join-Path $env:GITHUB_WORKSPACE '.build\openvino-package'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $archive) | Out-Null

          # 命中 actions/cache 时跳过下载，但每次仍校验 SHA-256，防止缓存损坏。
          if (-not (Test-Path -LiteralPath $archive)) {
            Invoke-WebRequest `
              -Uri $env:OPENVINO_RUNTIME_URL `
              -OutFile $archive `
              -MaximumRedirection 10
          }
          if ((Get-Item -LiteralPath $archive).Length -lt 1000000) {
            throw "OpenVINO 成品包体积异常: $archive"
          }
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:OPENVINO_RUNTIME_SHA256) {
            throw "OpenVINO 成品包 SHA-256 校验失败: expected=$env:OPENVINO_RUNTIME_SHA256 actual=$actualHash"
          }

          if (Test-Path -LiteralPath $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $packageRoot = (Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1).FullName
          if (-not $packageRoot) {
            throw "OpenVINO 成品包解压后没有顶层目录: $extract"
          }

          # 兼容两种成品包布局：旧版根目录 openvino/、models/；新版 deps/openvino、deps/models。
          $layout = $null
          foreach ($candidate in @(
            @{ Ov = 'openvino'; Models = 'models' },
            @{ Ov = 'deps\openvino'; Models = 'deps\models' }
          )) {
            $dll = Join-Path (Join-Path $packageRoot $candidate.Ov) 'runtime\bin\intel64\Release\openvino_c.dll'
            if (Test-Path -LiteralPath $dll -PathType Leaf) {
              $layout = $candidate
              break
            }
          }
          if (-not $layout) {
            throw "OpenVINO 成品包布局无法识别: $packageRoot"
          }
          $runtimeBin = Join-Path (Join-Path $packageRoot $layout.Ov) 'runtime\bin\intel64\Release'
          $tbbBin = Join-Path (Join-Path $packageRoot $layout.Ov) 'runtime\3rdparty\tbb\bin'
          if (-not (Test-Path -LiteralPath $tbbBin -PathType Container)) {
            throw "OpenVINO 成品包缺少 oneTBB 运行时: $tbbBin"
          }
          $modelsRoot = Join-Path $packageRoot $layout.Models
          if (-not (Test-Path -LiteralPath (Join-Path $modelsRoot 'PP-OCRv6_small_det.xml') -PathType Leaf)) {
            throw "OpenVINO 成品包缺少 IR 模型: $modelsRoot"
          }
          $envPath = "$runtimeBin;$tbbBin;$env:PATH"
          "OPENVINO_PACKAGE_ROOT=$packageRoot" >> $env:GITHUB_ENV
          "OPENVINO_PACKAGE_OV=$($layout.Ov)" >> $env:GITHUB_ENV
          "OPENVINO_PACKAGE_MODELS=$($layout.Models)" >> $env:GITHUB_ENV
          "OPENVINO_OCR_IR_ROOT=$modelsRoot" >> $env:GITHUB_ENV
          "OPENVINO_OCR_CHARSET=$(Join-Path $modelsRoot 'ppocr_keys_v6_small.txt')" >> $env:GITHUB_ENV
          "PATH=$envPath" >> $env:GITHUB_ENV

      - name: 缓存 OCR 模型
        uses: actions/cache@v5
        with:
          path: models
          key: pp-ocrv6-small-models-v2.3.1-sha256-2c6277ab-ed59cc29-b5f2bfe2

      - name: 下载 PP-OCRv6 small 模型
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $files = @(
            'PP-OCRv6_small_det.mnn',
            'PP-OCRv6_small_rec.mnn',
            'ppocr_keys_v6_small.txt'
          )
          $expectedHashes = @{
            'PP-OCRv6_small_det.mnn' = '2c6277abbbddb4c77a790f4650cdd7f8ab33512db38fac372ed5471538070619'
            'PP-OCRv6_small_rec.mnn' = 'ed59cc294fe2d564bd64f929b5356b70abd0977f99e7e60e3b08cfeef4ef72be'
            'ppocr_keys_v6_small.txt' = 'b5f2bfe2bdd9448429e3e82b51c789775d9b42f2403d082b00662eb77e401c5d'
          }
          foreach ($file in $files) {
            $path = "models/$file"
            if (Test-Path -LiteralPath $path -PathType Container) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
            $needsDownload = $true
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              $needsDownload = $actualHash -ne $expectedHashes[$file]
            }
            if ($needsDownload) {
              Invoke-WebRequest -Uri "$env:OCR_MODEL_BASE_URL/$file" -OutFile $path
            }
            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHashes[$file]) {
              throw "OCR 模型 SHA-256 校验失败: file=$file expected=$($expectedHashes[$file]) actual=$actualHash"
            }
          }

      # runner 池里有些机器的 CPU 缺少 OpenVINO 打出的指令，进程会以
      # STATUS_ILLEGAL_INSTRUCTION (0xc000001d) 直接崩溃——Rust 侧捕获不到，
      # 也没法在脚本里可靠预判（不同构建用的指令集不同）。
      # 这两步是模型冒烟验证，不该因为换到一台老 CPU 就阻断整个发布：
      # 允许失败，日志里仍然会记录崩溃原因，人看得出来是环境问题。
      - name: OpenVINO IR 真实截图 smoke test
        shell: pwsh
        continue-on-error: true
        run: cargo test --locked --no-default-features --features ocr-openvino configured_ir_models_recognize_fixture -- --ignored --nocapture

      - name: OpenVINO 请求复用与 CTC 回归
        shell: pwsh
        continue-on-error: true
        run: cargo test --locked --no-default-features --features ocr-openvino runtime::ocr::engine::openvino::perf_tests -- --include-ignored --nocapture

      - name: 解析快速链接器 lld-link
        id: linker
        shell: pwsh
        run: |
          $candidates = @()
          $command = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          if ($command) { $candidates += $command.Source }
          if ($env:LIBCLANG_PATH) {
            $candidates += (Join-Path $env:LIBCLANG_PATH 'lld-link.exe')
          }
          $candidates += (Join-Path ${env:ProgramFiles} 'LLVM\bin\lld-link.exe')
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path -LiteralPath $vswhere) {
            $vsInstall = & $vswhere -latest -products * -property installationPath
            if ($vsInstall) {
              $candidates += (Join-Path $vsInstall 'VC\Tools\Llvm\x64\bin\lld-link.exe')
            }
          }
          $lldLink = $candidates |
            Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
            Select-Object -First 1
          if ($lldLink) {
            Write-Host "使用 lld-link: $lldLink"
            "lld_link=$lldLink" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning '未找到 lld-link，回退默认 MSVC 链接器'
            "lld_link=" >> $env:GITHUB_OUTPUT
          }

      - name: 安装 Node（前端构建）
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建 Vue 面板（web/dist）
        shell: pwsh
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 编译 Release EXE
        shell: pwsh
        env:
          # 用 env 传值，不要把 `${{ ... }}` 直接插进 PowerShell 源码：
          # 插值是在脚本解析**之前**做的，值里的引号/分号/`$()` 会变成代码。
          LLD_LINK: ${{ steps.linker.outputs.lld_link }}
        run: |
          $lldLink = $env:LLD_LINK
          if ($lldLink) {
            $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = $lldLink
          }
          # 依赖缓存完整命中时用 --offline 自检，跳过 crates.io 索引更新（每次约 20–90s）。
          $offlineReady = $false
          try {
            & cargo fetch --locked --offline *> $null
            $offlineReady = $LASTEXITCODE -eq 0
          } catch {
            $offlineReady = $false
          }
          if ($offlineReady) {
            $env:CARGO_NET_OFFLINE = 'true'
            Write-Host 'cargo 离线自检通过，本次构建跳过 crates.io 索引更新'
          } else {
            Write-Warning 'cargo 离线自检未通过（缓存不完整），本次构建仍走网络更新索引'
          }
          # 只编译一次双后端版本：OpenVINO 走 runtime-linking（libloading 运行时加载 DLL），
          # 不在 PE 导入表里，所以同一个 EXE 删掉 deps/openvino 后会自动回落到 MNN。
          cargo build --workspace --release --target x86_64-pc-windows-msvc --locked
          if ($LASTEXITCODE -ne 0) { throw 'Workspace release build failed' }

      - name: 准备产物
        shell: pwsh
        run: |
          # 显式声明：PowerShell 默认对非终止错误继续往下跑，必须 Stop 才能让
          # 「拷贝/重命名失败」真正中断步骤（对照下载/解压步骤已做的同一件事）。
          $ErrorActionPreference = 'Stop'
          $dist = 'dist/miliastra-wonderland-music-windows-x64'
          if (Test-Path -LiteralPath $dist) {
            Remove-Item -LiteralPath $dist -Recurse -Force
          }
          & ./scripts/package-ffmpeg-runtime.ps1 `
            -FfmpegRoot 'vendor/ffmpeg/8.1/windows-x64' `
            -MinGwRuntime 'vendor/ffmpeg/8.1/windows-x64/bin/libwinpthread-1.dll' `
            -Executable 'target/x86_64-pc-windows-msvc/release/miliastra-wonderland-music.exe' `
            -LoginHelper 'target/x86_64-pc-windows-msvc/release/miliastra-login-helper.exe' `
            -Mnn 'vendor/mnn/3.6.0/windows-x64/bin/MNN.dll' `
            -Destination $dist `
            -Objdump $env:OBJDUMP
          # 发布布局：EXE 根目录只保留主程序与 config.yaml，其余依赖统一放入 deps/。
          New-Item -ItemType Directory -Force -Path (Join-Path $dist 'deps/bin'), (Join-Path $dist 'deps/dll') | Out-Null
          Move-Item -LiteralPath (Join-Path $dist 'miliastra-login-helper.exe') -Destination (Join-Path $dist 'deps/bin')
          foreach ($dll in @('MNN.dll', 'avformat-62.dll', 'avcodec-62.dll', 'avutil-60.dll', 'swresample-6.dll', 'libwinpthread-1.dll')) {
            Move-Item -LiteralPath (Join-Path $dist $dll) -Destination (Join-Path $dist 'deps/dll')
          }
          Copy-Item 'assets' (Join-Path $dist 'deps') -Recurse
          Copy-Item 'models' (Join-Path $dist 'deps') -Recurse
          # OpenVINO 运行时与 IR 打进完整包；精简包在后续步骤从副本删掉这些文件。
          $openvinoPackage = $env:OPENVINO_PACKAGE_ROOT
          if (-not $openvinoPackage) {
            throw 'OPENVINO_PACKAGE_ROOT 未设置，无法打包 OpenVINO runtime'
          }
          $packageRuntime = Join-Path $openvinoPackage $env:OPENVINO_PACKAGE_OV
          if (-not (Test-Path -LiteralPath (Join-Path $packageRuntime 'runtime\bin\intel64\Release\openvino_c.dll') -PathType Leaf)) {
            throw "OpenVINO 成品包缺少运行时: $packageRuntime"
          }
          Copy-Item -LiteralPath $packageRuntime -Destination (Join-Path $dist 'deps') -Recurse
            foreach ($ir in @('PP-OCRv6_small_det.xml', 'PP-OCRv6_small_det.bin', 'PP-OCRv6_small_rec.xml', 'PP-OCRv6_small_rec.bin')) {
            $source = Join-Path (Join-Path $openvinoPackage $env:OPENVINO_PACKAGE_MODELS) $ir
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "OpenVINO 成品包缺少 IR 模型: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $dist 'deps\models') -Force
          }
          Copy-Item 'config.example.yaml' (Join-Path $dist 'config.yaml')
          New-Item -ItemType Directory -Force -Path (Join-Path $dist 'deps/docs') | Out-Null
          # 成品包自带的 OpenVINO / oneTBB 许可证随完整包分发。
          foreach ($license in @('OPENVINO-LICENSE.txt', 'OPENVINO-THIRD-PARTY-NOTICES.txt', 'TBB-LICENSE.txt')) {
            $source = Join-Path $openvinoPackage $license
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "OpenVINO 成品包缺少许可证文件: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $dist 'deps/docs') -Force
          }
          Copy-Item 'turtle_soup.example.yaml', 'undercover.example.yaml', 'README.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md' (Join-Path $dist 'deps/docs')
          # 复制 docs/ 的**内容**，不是 docs 目录本身：目标 deps/docs 已经存在
          # （上一行 New-Item 建好、许可证也放进去了），此时 `Copy-Item 'docs' ... -Recurse`
          # 会把源目录作为子目录塞进去，产物变成 deps/docs/docs/…。
          # 用 'docs\*' 并且去掉 -Recurse 之外的东西：-Recurse 对通配符展开后的
          # 目录项依然生效，子目录会被完整复制。
          Copy-Item 'docs\*' (Join-Path $dist 'deps/docs') -Recurse -Force
          # 校验扁平布局：docs/docs 是这次修掉的旧 bug，出现即失败。
          if (Test-Path -LiteralPath (Join-Path $dist 'deps/docs/docs') -PathType Container) {
            throw '发布包布局错误：出现 deps/docs/docs（docs 被当成子目录复制了）'
          }
          # 预置配置库：用主程序自身初始化 deps/data/playback.sqlite3，避免为同一操作再链接一个 example 可执行文件。
          & 'target/x86_64-pc-windows-msvc/release/miliastra-wonderland-music.exe' --ensure-config-db (Join-Path $dist 'config.yaml')
          if ($LASTEXITCODE -ne 0) { throw '发布配置库初始化失败' }
          # 初始化会生成构建机令牌；恢复模板，让每份安装在首次启动时生成独立令牌。
          Copy-Item 'config.example.yaml' (Join-Path $dist 'config.yaml') -Force


          $requiredDirectories = @(
            'deps\assets',
            'deps\models',
            'deps\openvino',
            'deps\dll',
            'deps\bin',
            'deps\docs'
          )
          foreach ($directory in $requiredDirectories) {
            if (-not (Test-Path -LiteralPath (Join-Path $dist $directory) -PathType Container)) {
              throw "发布包缺少必需目录: $directory"
            }
          }

          $requiredFiles = @(
            'miliastra-wonderland-music.exe',
            'config.yaml',
            'deps\bin\miliastra-login-helper.exe',
            'deps\dll\MNN.dll',
            'deps\dll\avformat-62.dll',
            'deps\dll\avcodec-62.dll',
            'deps\dll\avutil-60.dll',
            'deps\dll\swresample-6.dll',
            'deps\dll\libwinpthread-1.dll',
            'deps\assets\idioms.txt',
            'deps\models\PP-OCRv6_small_det.mnn',
            'deps\models\PP-OCRv6_small_rec.mnn',
            'deps\models\ppocr_keys_v6_small.txt',
            'deps\data\playback.sqlite3',
            'deps\docs\turtle_soup.example.yaml',
            'deps\docs\undercover.example.yaml',
            'deps\docs\README.md',
            'deps\docs\THIRD_PARTY_NOTICES.md',
            # docs/ 是扁平复制进来的（见上面的 Copy-Item 'docs\*'），
            # 抽查一个文档确认复制真的发生了，而不是只建了空目录。
            'deps\docs\index.md',
            'deps\docs\user-guide.md'
          )
          $requiredFiles += @(
            'deps\models\PP-OCRv6_small_det.xml',
            'deps\models\PP-OCRv6_small_det.bin',
            'deps\models\PP-OCRv6_small_rec.xml',
            'deps\models\PP-OCRv6_small_rec.bin',
            'deps\openvino\runtime\bin\intel64\Release\openvino_c.dll',
            'deps\openvino\runtime\bin\intel64\Release\openvino_intel_cpu_plugin.dll',
            'deps\openvino\runtime\3rdparty\tbb\bin\tbb12.dll',
            'deps\docs\OPENVINO-LICENSE.txt',
            'deps\docs\OPENVINO-THIRD-PARTY-NOTICES.txt',
            'deps\docs\TBB-LICENSE.txt'
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $dist $file) -PathType Leaf)) {
              throw "发布包缺少必需文件: $file"
            }
          }

      - name: 生成精简包（MNN-only）
        shell: pwsh
        run: |
          # 显式声明：PowerShell 默认对非终止错误继续往下跑，必须 Stop 才能让
          # 「拷贝/重命名失败」真正中断步骤（对照下载/解压步骤已做的同一件事）。
          $ErrorActionPreference = 'Stop'
          # 同一个 EXE 就能当 MNN-only 用：OpenVINO 通过 libloading 在运行时加载，
          # 不在 PE 导入表里；删掉 deps/openvino 后运行时会 warn 并回落到 cpu(MNN)。
          # 因此不必再编译一次，只复制一份产物并移除 OpenVINO 相关文件即可。
          $source = 'dist/miliastra-wonderland-music-windows-x64'
          $target = 'dist/miliastra-wonderland-music-windows-x64-mnn'
          if (Test-Path -LiteralPath $target) {
            Remove-Item -LiteralPath $target -Recurse -Force
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse

          # OpenVINO 运行时目录与 IR 模型只属于完整包。
          $dropDir = Join-Path $target 'deps\openvino'
          if (Test-Path -LiteralPath $dropDir) {
            Remove-Item -LiteralPath $dropDir -Recurse -Force
          }
          foreach ($ir in @('PP-OCRv6_small_det.xml', 'PP-OCRv6_small_det.bin', 'PP-OCRv6_small_rec.xml', 'PP-OCRv6_small_rec.bin')) {
            $path = Join-Path (Join-Path $target 'deps\models') $ir
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }
          foreach ($license in @('OPENVINO-LICENSE.txt', 'OPENVINO-THIRD-PARTY-NOTICES.txt', 'TBB-LICENSE.txt')) {
            $path = Join-Path (Join-Path $target 'deps\docs') $license
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }

          # 精简包必须仍然可用：核心运行时与 MNN 模型一个都不能少。
          $mnnRequired = @(
            'miliastra-wonderland-music.exe',
            'config.yaml',
            'deps\dll\MNN.dll',
            'deps\models\PP-OCRv6_small_det.mnn',
            'deps\models\PP-OCRv6_small_rec.mnn',
            'deps\models\ppocr_keys_v6_small.txt',
            'deps\data\playback.sqlite3'
          )
          foreach ($file in $mnnRequired) {
            if (-not (Test-Path -LiteralPath (Join-Path $target $file) -PathType Leaf)) {
              throw "精简包缺少必需文件: $file"
            }
          }
          if (Test-Path -LiteralPath $dropDir) {
            throw '精简包不应包含 deps/openvino'
          }

      - name: 打包 Release zip
        shell: pwsh
        env:
          ZIP_FULL_NAME: ${{ needs.version-gate.outputs.zip_full }}
          ZIP_BASIC_NAME: ${{ needs.version-gate.outputs.zip_basic }}
        run: |
          $full = $env:ZIP_FULL_NAME
          $basic = $env:ZIP_BASIC_NAME
          if (-not $full -or -not $basic) {
            throw 'zip 名称未从 version-gate 取得'
          }
          Compress-Archive -Path 'dist/miliastra-wonderland-music-windows-x64' -DestinationPath "dist/$full" -Force
          Compress-Archive -Path 'dist/miliastra-wonderland-music-windows-x64-mnn' -DestinationPath "dist/$basic" -Force
          "ZIP_FULL=dist/$full" >> $env:GITHUB_ENV
          "ZIP_BASIC=dist/$basic" >> $env:GITHUB_ENV

      - name: 上传产物（含 OpenVINO）
        uses: actions/upload-artifact@v6
        with:
          name: miliastra-wonderland-music-windows-x64-openvino
          path: dist/miliastra-wonderland-music-windows-x64

      - name: 上传产物（MNN 精简版）
        uses: actions/upload-artifact@v6
        with:
          name: miliastra-wonderland-music-windows-x64-mnn
          path: dist/miliastra-wonderland-music-windows-x64-mnn

      - name: 解析发布说明文件
        id: release_notes
        shell: pwsh
        env:
          # 版本号来自 workflow_dispatch 输入，绝不能直接插值进脚本正文；
          # 上游 validate_version 已做严格白名单，这里再走 env 传一遍。
          RELEASE_VERSION: ${{ needs.version-gate.outputs.version }}
        run: |
          $path = ".github/release-notes/$env:RELEASE_VERSION.md"
          if (Test-Path -LiteralPath $path -PathType Leaf) {
            "body_path=$path" >> $env:GITHUB_OUTPUT
          } else {
            "body_path=" >> $env:GITHUB_OUTPUT
          }

      - name: 创建 GitHub Release（使用发布说明）
        if: needs.version-gate.outputs.create_release == 'true' && steps.release_notes.outputs.body_path != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version-gate.outputs.version }}
          name: Miliastra Wonderland Music ${{ needs.version-gate.outputs.version }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
          files: |
            ${{ env.ZIP_FULL }}
            ${{ env.ZIP_BASIC }}

      - name: 创建 GitHub Release（自动生成说明）
        if: needs.version-gate.outputs.create_release == 'true' && steps.release_notes.outputs.body_path == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version-gate.outputs.version }}
          name: Miliastra Wonderland Music ${{ needs.version-gate.outputs.version }}
          files: |
            ${{ env.ZIP_FULL }}
            ${{ env.ZIP_BASIC }}
          generate_release_notes: true
