# 三个平台凭据的版本化存储目录
credential_directory: deps/data/credentials

# 受控登录使用的短生命周期助手
login_helper_executable: miliastra-login-helper.exe

# 内置酷狗概念版 API sidecar；默认不启用。
# 仅当程序目录下存在 kugou-api.exe 或 app_win.exe 时才自动启动，
# 否则使用下方 kugou_api_base_url（外部已运行 KuGouMusicApi 服务时仍可访问）。
kugou_api_executable: kugou-api.exe

# 单次交互登录的最长时间，单位毫秒
login_timeout_ms: 180000

# 酷狗 KuGouMusicApi 服务地址；文档站不是 API 服务
kugou_api_base_url: http://127.0.0.1:3000

# 音频数据缓存（本地代理 + 磁盘缓存）：缺失或 enabled=false 时不启用。
# 播放时音源先落本地缓存，重复播放与断网时直接从磁盘服务。
audio_cache:
  enabled: true

  # 音频文件目录；相对路径基于程序 exe 所在目录，留空默认 deps/cache/audio
  directory: deps/cache/audio

  # 统一播放数据库所在目录；须与 state.playback_state_path 的父目录一致
  metadata_directory: deps/data

  # 磁盘占用上限，单位 MiB（20 GiB）
  max_bytes_mb: 20480

  # 同时进行的源站下载任务上限
  max_concurrent_downloads: 2

  # 源站连接/响应超时，单位毫秒
  request_timeout_ms: 15000

  # 请求尚未下载完成的位置时，等待下载推进的最长时间，单位毫秒
  seek_wait_timeout_ms: 10000