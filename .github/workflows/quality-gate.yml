name: Linux 质量门禁（Quality Gate）

# 产品只支持 Windows（src/main.rs 对非 Windows 目标就是 compile_error!），这里**只**验证库目标，
# 与 build-windows-*.yml 的发版构建完全独立：互不触发、互不依赖。
#
# 触发：每次 push / pull_request 都跑，不做发版路径过滤。
# 现有发版工作流只在“版本号提交”时触发，普通代码提交此前没有任何自动检查，这里补上这一环。
on:
  push:
  pull_request:
  workflow_dispatch:

# 最小权限：只读仓库内容。工作流不需要 token 写入或发布能力。
permissions:
  contents: read

# 同一分支的新运行取代旧运行：push 按分支名分组，PR 按 PR 号分组。
# 既避免同分支并发跑多份门禁互相拖慢，也避免旧提交的绿灯盖住新提交。
concurrency:
  group: quality-gate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Cargo.lock 里有 git 依赖（rust-paddle-ocr 锁定在 tag v2.3.1）：走 git CLI 拉取，
  # Swatinem/rust-cache 的 git 依赖缓存才能命中。
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  # ===========================================================================
  # 门禁一：前端构建
  #
  # 必须独立成 job，不要和 Rust 门禁挤进同一个脚本：GitHub Actions 的 `run:` 以
  # `bash -e` + `set -eo pipefail` 执行，`cd web && npm ci && npm run build` 之后
  # 如不显式 cd 回来，同一脚本里后面的 `cargo ...` 会继续在 web/ 下执行，
  # 直接报 "could not find Cargo.toml"。分开写也让 Rust job 在前端失败时直接跳过。
  # ===========================================================================
  web-build:
    name: 前端构建（web/dist）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 门禁只读当前提交，不需要历史。
          fetch-depth: 1

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 与 build-windows-exe.yml 保持一致，避免本地与发版构建出现 Node 版本差异。
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖并构建面板
        # working-directory 优于在脚本里 cd：每一步起点明确，不会把当前目录泄漏给后续步骤。
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 校验产物
        # build.rs 以 web/dist/index.html 作为“面板产物就绪”的唯一判据；
        # 缺它就是发布出没有面板的 exe。把判据前移到这里，失败信息更直接。
        run: |
          test -f web/dist/index.html
          ls -la web/dist

  # ===========================================================================
  # 门禁二：仓库脚本（分层方向 / 日志文案 / 面板 API 覆盖 / 入库边界）
  #
  # 全部只读 src/、web/src/、scripts/，不碰网络、不碰工具链，
  # 因此单独成一个 job 与 Rust 门禁并发跑，反馈更快。
  # ===========================================================================
  repo-scripts:
    name: 代码规范与脚本门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      # 不往仓库里写 __pycache__（这些都是单文件脚本，字节码缓存没有收益）。
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 分层方向检查
        # 只允许上层依赖下层；规则在 scripts/layer-policy.json，违规时退出码 1 并打印反向边。
        run: python3 scripts/check-layers.py

      - name: 日志文案检查
        # 禁止 {:?} 调试格式、字段堆砌、全英文消息等；规则见 technical-docs/logging-style.md。
        run: python3 scripts/check-log-style.py

      - name: 面板 API 覆盖率
        # 解析 src/interfaces/http/protocol.rs 的路由表 vs web/src 里的 URL 字面量。
        # 脚本约定“退出码恒 0，仅用于报告”，所以这里显式把「未覆盖 > 0」判成失败：
        # 面板字段是前后端冻结契约，路由加了却没人调，等于面板功能静默缺失。
        run: |
          set -euo pipefail
          report=$(python3 scripts/panel-api-coverage.py)
          printf '%s\n' "$report"
          missing=$(printf '%s\n' "$report" | sed -n 's/.*未覆盖 \([0-9][0-9]*\) 个.*/\1/p' | tail -n 1)
          [ -n "$missing" ] || { echo "::error::无法从 panel-api-coverage.py 输出解析未覆盖数，脚本输出格式可能已变"; exit 1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::面板 API 覆盖率未满：$missing 条 Rust 路由前端未调用（路由表与 web/src 不同步）"
            python3 scripts/panel-api-coverage.py --json
            exit 1
          fi

      # 隐私扫描不放在这个 job：见 rust-gate 末尾“隐私扫描”一步的说明。
      - name: 入库边界检查（technical-docs 不得入库）
        # technical-docs/ 整个目录被 .gitignore 忽略（隐私红线：测试图与真实帧只本地保留）。
        # 这里确认它没有被误加进索引；命中即失败。
        run: |
          if git ls-files --error-unmatch technical-docs >/dev/null 2>&1; then
            echo "::error::technical-docs/ 不应被提交（隐私红线：测试图与真实帧只本地保留）"
            exit 1
          fi
          echo "technical-docs/ 未纳入索引，符合预期"

      # ---- 前端单元测试（node:test，零依赖）-----------------------------------
      # 放在 repo-scripts 而不是 web-build：这里不装依赖、不构建，`node --test` 只用
      # Node 内置模块，几秒钟就能给出结果，失败原因也比「构建失败」精确得多。
      # 用例全部在 web/src/**（web/ 是入库目录；tests/ 在本仓库是符号链接且被 gitignore 挡住，
      # 往那里写测试既不入库、还会写到主检出目录去）。
      - name: 安装 Node（单元测试用）
        uses: actions/setup-node@v4
        with:
          # 与 web-build 保持一致：测试跑在与构建相同的运行时上才有意义。
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 前端单元测试（node --test）
        working-directory: web
        run: |
          set -euo pipefail
          # 先确认测试文件真的存在。`node --test` 在「一个测试文件都没找到」时是
          # 静默通过（退出码 0）——不挡住这一条，这个门禁就会退化成永远绿灯的摆设。
          mapfile -t test_files < <(find src -type f -name '*.test.mjs' | sort)
          [ "${#test_files[@]}" -gt 0 ] || {
            echo "::error::web/src 下没有找到任何 *.test.mjs，前端单元测试实际上没有执行"
            exit 1
          }
          printf '发现 %d 个前端测试文件：\n' "${#test_files[@]}"
          printf '  %s\n' "${test_files[@]}"
          # 用 runner 自身的递归发现（Node 20 起支持），不要依赖 shell glob：
          # CI 的 bash 默认没有 globstar，`src/**/*.test.mjs` 在子目录上匹配不到。
          node --test

  # ===========================================================================
  # 门禁三：Rust（格式 / 检查 / 单元测试 + clippy 报告）+ 隐私扫描
  #
  # 两处“全局唯一”的配置集中在这里：
  #
  # 1) CARGO_HOME 指到 runner 的临时目录（`$RUNNER_TEMP/cargo-home`）。
  #    过去它指向 `/opt/quality-gate/cargo-home`，有两个问题：
  #      - `ubuntu-latest` 上 /opt 属于 root，runner 用户不可写，第一次写
  #        registry 就 Permission denied；
  #      - 注释当时声称这样能“屏蔽仓库内的 Windows 专用 [env]”，**这是错的**。
  #        CARGO_HOME 只改变 `$CARGO_HOME/config.toml` 的位置，cargo 仍会从工作区
  #        向上读 `.cargo/config.toml`，[env] 照样生效。
  #    真正的修法是把 Windows 专用变量从 `.cargo/config.toml` 挪走（已做：
  #    那个文件现在是空的，FFMPEG_DIR / MNN_* 由 build-windows-exe.yml 的 step env 提供）。
  #    这里保留一个临时 CARGO_HOME 只是为了缓存目录固定可复用，不再承担“隔离”职责。
  #    `--no-default-features` 关掉两个 OCR 后端，Linux 因此完全不需要 MNN / OpenVINO / nasm。
  #
  # 2) lld 链接。链接阶段是 Rust 门禁最慢的一环，统一换成 lld。RUSTFLAGS 只在 job 级设置，
  #    所有 cargo 调用看到同一组参数。rustup 默认工具链自带 rust-lld，GitHub 的 Ubuntu 基础
  #    镜像也有 ld.lld；`校验系统依赖` 一步会显式确认它的存在。
  # ===========================================================================
  rust-gate:
    name: Rust 门禁（fmt / check / test / clippy）
    runs-on: ubuntu-latest
    # 本地实测（Linux、--lib、--test-threads=1）：冷编译约 2.5 分钟，2332 个用例一轮 417 秒，
    # 整个 job 冷启动约 12 分钟；rust-cache 命中后编译阶段基本消失。45 分钟的余量足够覆盖
    # runner 抖动与串行用例变慢，又不至于让真卡死的运行占满赛道。
    timeout-minutes: 45
    needs: web-build
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 门禁用不到历史：cargo fmt/check/test 与隐私扫描都只看当前工作树。
          fetch-depth: 1

      # ---- 工具链 ----------------------------------------------------------
      # 注意 CARGO_HOME 不能写在 job 级 `env:`：`jobs.<job_id>.env` 的可用上下文里
      # **没有** `runner`（只有 github/needs/strategy/matrix/vars/secrets/inputs），
      # 写了 `${{ runner.temp }}` 会直接报表达式错误。改为在这里写进 $GITHUB_ENV，
      # 后续所有步骤（含 uses: 步骤）都能读到。
      - name: 初始化临时 CARGO_HOME
        run: |
          set -euo pipefail
          cargo_home="$RUNNER_TEMP/cargo-home"
          mkdir -p "$cargo_home"
          test -w "$cargo_home" || { echo "::error::$cargo_home 不可写"; exit 1; }
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$cargo_home"

      # 不给 toolchain 输入：仓库里有 rust-toolchain.toml（channel = 1.96.0，
      # components = rustfmt, clippy）。rustup 会按它自动安装并锁定版本，
      # CI 里不必重复写一遍版本号（写死反而会在改钉版本时悄悄失配）。
      # 注意：这里与 build-windows-*.yml 的 `dtolnay/rust-toolchain@1.96.0` 不同，是有意的：
      # 门禁的版本来源只认 rust-toolchain.toml，钉版本时两个工作流会一起跟随。
      - name: 安装 Rust（按 rust-toolchain.toml 钉版本）
        uses: dtolnay/rust-toolchain@stable

      - name: 校验 Rust 版本与组件
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          pinned=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$pinned" ] || { echo "::error::rust-toolchain.toml 里没有 channel"; exit 1; }
          rustc --version | grep -q "^rustc $pinned " \
            || { echo "::error::rust-toolchain.toml 钉定的版本没有生效"; exit 1; }
          for component in rustfmt clippy; do
            # `rustup component list --installed` 的输出带目标三元组，
            # 形如 `rustfmt-x86_64-unknown-linux-gnu`。
            # 旧写法 `grep -qx "$component"` 是整行精确匹配，永远不命中 —— 这一步
            # 只要跑到就必红。这里按「组件名 + 连字符或行尾」匹配，版本后缀
            # （如 `-x86_64-unknown-linux-gnu`）一并吃掉。
            rustup component list --installed | grep -Eq "^${component}(-|$)" \
              || { echo "::error::缺少 $component 组件（rustup component list --installed 里找不到 ${component}-*）"; exit 1; }
          done

      # ---- Linux 系统依赖 ---------------------------------------------------
      # 逐个确认过的清单（不是照搬）：
      #   - cpal -> alsa：编译期需要 libasound2-dev（pkg-config 探针），所有 target 都会编，
      #     `--lib` 也躲不掉；libasound2（运行时）随之装上；
      #   - ffmpeg-next -> ffmpeg-sys-next 9.0：`--no-default-features` 只关掉 OCR，
      #     miliastra-playback 仍依赖它；找不到系统 ffmpeg 时 build.rs 直接 exit(1)；
      #   - ffmpeg-sys-next -> bindgen 0.72：需要 libclang（预编译产物即可，不必装 clang 本体）；
      #   - aws-lc-sys（rustls 底层加密库，默认 target 也会编）：构建阶段用 cmake；
      #   - enigo 0.6 在 Linux 上是纯 Rust（不链接 libxdo）：不装 libxdo-dev。
      # 是否齐全用显式探针验证，避免 apt 失败或空 apt-get update 时静默放过。
      - name: 安装 Linux 构建依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            libclang-dev \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev

      - name: 校验系统依赖
        run: |
          set -euo pipefail
          command -v pkg-config
          command -v cmake
          command -v ld.lld
          pkg-config --exists alsa
          pkg-config --exists libavcodec libavformat libavutil libswresample
          echo "libclang=$(ls /usr/lib/llvm-*/lib/libclang.so* | head -n 1)"

      # ---- 缓存 -------------------------------------------------------------
      # 缓存键由 action 自动组合：Rust 版本、锁文件哈希、环境与 RUSTFLAGS 等；
      # 额外的 key 前缀只用来隔离本工作流的缓存，不与 build-windows-* 混用。
      - name: 缓存 Cargo 构建
        uses: Swatinem/rust-cache@v2
        with:
          # 每行语义是 `<工作区目录> [-> <target 目录>]`。这里只需要一个工作区。
          # 旧写法还填了 `/opt/quality-gate/cargo-home` 一行 —— 那是 CARGO_HOME 的
          # 绝对路径，既不是工作区、也没有 `-> target`，action 解析不出任何东西，
          # 那条缓存项等于落空。CARGO_HOME 的缓存由 action 自己按 registry/git
          # 目录处理，不需要（也不能）在这里声明。
          workspaces: |
            . -> target
          key: linux-quality-gate

      # ---- 前端产物 ---------------------------------------------------------
      # build.rs 读 web/dist/index.html 生成 panel_assets.rs 并 include_str! 进库：
      # 产物缺失时只打一条 cargo:warning 并回退空表，**构建照样通过** —— 本地实测确认：
      # 缺产物时 cargo check 退出码 0，panel_assets.rs 只占 2 行，面板静默消失。
      # 真到发版才会发现，所以必须先让 web/dist 就绪，再跑任何 cargo 命令。
      # 这里重新构建而不是从 web-build 传 artifact：让 Rust job 自包含，
      # 用十几秒的 vite build 换掉一整套 upload/download-artifact，失败原因也更直观。
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端产物（web/dist）
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 校验前端产物
        run: test -f web/dist/index.html

      # ---- Rust 门禁 --------------------------------------------------------
      - name: 格式检查（cargo fmt --all --check）
        run: cargo fmt --all --check

      - name: 编译检查（cargo check --workspace --lib --no-default-features，零警告门禁）
        # Wave 4 已将 5 个工作区 crate 的 Linux 非测试库构建告警全部清零（src/lib.rs 仅对
        # all(not(windows), not(test)) 放过 Windows-only 生产入口的 dead_code，其余告警与
        # Windows 构建均严格检查）。这里通过 JSON 诊断精确统计工作区 crate 的 compiler-message
        # warning，在不改动 job 级 RUSTFLAGS（避免破坏 cargo test 缓存复用）的前提下强制 0 警告。
        run: |
          set -euo pipefail
          cargo check --locked --workspace --lib --no-default-features --message-format=json-diagnostic-rendered-ansi \
            | python3 -c '
          import json, sys
          warnings = []
          for line in sys.stdin:
              line = line.strip()
              if not line.startswith("{"):
                  continue
              event = json.loads(line)
              if event.get("reason") != "compiler-message":
                  continue
              msg = event.get("message") or {}
              rendered = msg.get("rendered") or ""
              if msg.get("level") == "warning":
                  warnings.append(rendered)
                  sys.stderr.write(rendered)
              elif msg.get("level") == "error":
                  sys.stderr.write(rendered)
          if warnings:
              sys.stderr.write(f"::error::workspace --lib 编译存在 {len(warnings)} 条告警，门禁要求零警告\n")
              sys.exit(1)
          print("workspace --lib 编译检查通过：0 警告")
          '

      - name: 单测（cargo test --workspace --lib --no-default-features）
        # 覆盖面的三处补充（B00-P1-6）：
        #   1) `--workspace`：workspace 有 5 个 member，旧命令只测根 crate，
        #      miliastra-kernel / miliastra-login-protocol / miliastra-playback 的
        #      `#[cfg(test)]` 一律不跑（对照上面的 check 本来就是 `--workspace`）。
        #   2) `--lib` 之外补 `-p miliastra-login-helper --bins`：这个 crate 只有
        #      `src/main.rs`（没有 lib 目标），`--lib` 永远碰不到它；它的单测挂在
        #      bin target 上，用 `--bins` 收。其余 crate 的 bin target 在 Linux 上
        #      有 `compile_error!`（产品只支持 Windows），所以**不能**全局加 `--bins`。
        #   3) `-- --test-threads=1` 是仓库既定用法（存在进程级 static），必须保留。
        run: |
          set -euo pipefail
          cargo test --locked --workspace --lib --no-default-features -- --test-threads=1
          cargo test --locked -p miliastra-login-helper --bins --no-default-features -- --test-threads=1

      - name: clippy（报告模式，不阻断）
        # 为什么是 report-only 而不是硬闸门：
        #   `cargo clippy --workspace --lib --no-default-features` 在 1.96.0 上
        #   实测有 100+ 条告警（collapsible_if / map-over-inspect / needless_borrow…），
        #   全在 `src/**` 与 `crates/**` —— 清零属于独立批量任务，本批次只做 CI 侧接线，
        #   不能顺手改业务代码（也避免把 clippy 变成长期红着的摆设）。
        #   真正的硬门禁是上一步的「零 warning `cargo check`」。
        # 这里仍然**执行**它，原因是：安装了 clippy 却从不运行（旧状态）时，
        #   - 新告警没有任何可见度；
        #   - `-D warnings` 级别的回归要等到有人手工跑才会发现。
        #   PR 上把结果落成 `::warning` 注释 + Job Summary，master/push 只留日志。
        #   告警数写进摘要，便于清零进度可量化（目标：把 count 降到 0 后改成 `-- -D warnings`）。
        continue-on-error: true
        run: |
          set -uo pipefail
          # continue-on-error 下不要 set -e：要让后面的统计照常跑完。
          log="${RUNNER_TEMP}/clippy-workspace-lib.log"
          cargo clippy --locked --workspace --lib --no-default-features --message-format=short \
            2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          warnings=$(grep -cE '^[^ ].*warning: ' "$log" || true)
          errors=$(grep -cE '^[^ ].*error(\[|:)' "$log" || true)
          echo "clippy 告警 $warnings 条、错误 $errors 条（lib target，--no-default-features）"
          {
            echo "### clippy（--workspace --lib）"
            echo ""
            echo "- 告警：**$warnings** 条"
            echo "- 错误：**$errors** 条"
            echo ""
            echo "报告模式：清零后应改成 \`cargo clippy ... -- -D warnings\` 并去掉 \`continue-on-error\`。"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=clippy 报告::clippy 退出码 $status（告警 $warnings 条）——本步骤不阻断，详细输出见日志 ${log}"
          fi

      # ---- 隐私扫描（需要远端身份映射，单独守卫）-----------------------------
      - name: 隐私扫描（scripts/privacy-filter.py --repo --check）
        # 必须在 cargo 之后：`--repo` 的扫描面包含 technical-docs/（本地工作树，带真实帧与报告），
        # 那是最可能命中的地方，也正是隐私红线最在意的地方。
        #
        # 这个脚本的映射只能从远端面板取（未配置时的默认地址是内网），GitHub 托管 runner
        # 访问不到，因此它实际有两条结局，不能笼统地“跑一下就算过”：
        #   - 退出码 1：可能是真有命中，也可能是取不到映射（后者是未捕获的 URLError
        #     traceback，而不是脚本文档里写的“退出码 2”——本地实测如此）；
        #   - 退出码 2：映射取到了但为空。
        # 所以只有“完全没有任何面板配置”时才显式跳过并告警，绝不冒充“零命中”。
        # 一旦配置了 MILIASTRA_PANEL_URL，失败就是真失败（红灯），不掩盖任何命中。
        env:
          MILIASTRA_PANEL_URL: ${{ secrets.MILIASTRA_PANEL_URL }}
          MILIASTRA_PANEL_TOKEN: ${{ secrets.MILIASTRA_PANEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MILIASTRA_PANEL_URL:-}" ]; then
            echo "::warning title=隐私扫描未执行::仓库未配置 MILIASTRA_PANEL_URL Secret，runner 访问不到内网面板；本次提交未做隐私扫描，本地仍须跑 scripts/privacy-filter.py --repo --check"
            exit 0
          fi
          python3 scripts/privacy-filter.py --repo --check
