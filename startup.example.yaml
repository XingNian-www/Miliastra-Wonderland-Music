# 程序启动后是否按配置自动排队执行“启动游戏”和“进入千星”
enabled: false

# 找不到游戏窗口时是否启动游戏
launch_game: true

# 是否处理“点击进入”等开门按钮
enter_game: true

# 是否按 M 打开地图，进入千星奇域大厅后停止
enter_wonderland: true

# 启动 EXE 路径；可填完整 exe 文件路径，也可填 exe 所在目录；留空时自动从米哈游启动器注册表查找官服/国际服
exe_path: ""

# 启动游戏时附加的命令行参数
game_args: ""

# 启动游戏后每次等待窗口出现的时间，单位毫秒
launch_wait_ms: 5000

# 启动游戏后最多检查窗口次数
launch_retries: 12

# OCR 等待并点击“点击进入”的最长时间，单位毫秒
enter_game_timeout_ms: 60000

# 等待千星奇域界面/大厅确认的最长时间，单位毫秒
enter_wonderland_timeout_ms: 300000

# 地图星型入口阶段最多匹配次数
wonderland_map_star_retries: 120

# 地图星型入口匹配轮询间隔，单位毫秒
wonderland_map_star_retry_ms: 2500

# 千星大厅 OCR 阶段最多重试次数
wonderland_hall_retries: 90

# 千星大厅 OCR 轮询间隔，单位毫秒
wonderland_hall_retry_ms: 2000

# 千星入口和确认弹窗各阶段过渡等待的最长时间，单位毫秒
wonderland_transition_timeout_ms: 60000

# 确认按钮消失后等待该区域像素稳定的最长时间，单位毫秒
wonderland_confirm_stable_timeout_ms: 60000

# 启动游戏结束时等待派蒙菜单模板的最长时间，单位毫秒
final_primary_timeout_ms: 120000

# 启动流程 OCR/截图轮询间隔，单位毫秒
poll_ms: 1000

# 像素稳定平均差阈值
stable_mean_threshold: 2.0

# 像素稳定变化比例阈值
stable_changed_ratio_threshold: 0.01

# 启动界面模板匹配阈值（例如派蒙菜单）；越高越严格
template_threshold: 0.9

# 千星确认按钮模板匹配阈值；越高越严格
wonderland_confirm_threshold: 0.9

# 进入千星流程模板资源；启动游戏完成判断使用 paimon_menu
templates:

  # 地图右下角星型入口模板
  wonderland_map_star: assets/startup-wonderland-map-star.png

  # 千星弹窗“确认”按钮模板
  wonderland_confirm: assets/startup-wonderland-confirm.png
  paimon_menu: assets/startup-paimon-menu.png

# “点击进入”按钮 OCR 区域
enter_game_text_region:
  x: 900
  y: 1000
  width: 130
  height: 40

# 右侧千星大厅选项 OCR 区域
wonderland_hall_ocr_region:
  x: 1280
  y: 0
  width: 640
  height: 1040

# 千星确认按钮模板区域
wonderland_confirm_region:
  x: 900
  y: 650
  width: 500
  height: 250

# 派蒙菜单/主界面模板区域
main_ui_region:
  x: 0
  y: 0
  width: 480
  height: 270

# 地图右下角星型入口模板区域
wonderland_map_star_region:
  x: 1700
  y: 850
  width: 220
  height: 230