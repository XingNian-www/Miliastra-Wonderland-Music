name: Rust 质量门

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: 格式、Clippy 与测试（Windows x64）
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 质量工具
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc-quality

      - name: 检查格式
        run: cargo fmt --all -- --check

      - name: Clippy 检查
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

      - name: 配置测试运行时 DLL
        shell: pwsh
        run: |
          $ffmpegBin = (Resolve-Path 'vendor/ffmpeg/8.1/windows-x64/bin').Path
          $mnnBin = (Resolve-Path 'vendor/mnn/3.6.0/windows-x64/bin').Path
          $ffmpegBin >> $env:GITHUB_PATH
          $mnnBin >> $env:GITHUB_PATH

      - name: 运行测试
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc

  portable-logic:
    name: 跨平台纯逻辑检查（Ubuntu）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cargo 尚不支持按 target 配置环境变量。用空进程变量阻止
    # .cargo/config.toml 的 Windows vendor 默认值注入 Linux 构建。
    env:
      MNN_INCLUDE_DIR: ""
      MNN_LIB_DIR: ""
      FFMPEG_DIR: ""

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 质量工具
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-portable-logic

      - name: Cargo Check
        run: cargo check --locked -p miliastra-kernel -p miliastra-contracts -p miliastra-login-protocol

      - name: 运行测试
        run: cargo test --locked -p miliastra-kernel -p miliastra-contracts -p miliastra-login-protocol

      - name: Clippy 检查
        run: cargo clippy --locked --all-targets -p miliastra-kernel -p miliastra-contracts -p miliastra-login-protocol -- -D warnings
