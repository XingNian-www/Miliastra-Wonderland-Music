# MNN/PaddleOCR 检测模型路径；OpenVINO-only 配置可设为 null 或省略
det_model: models/PP-OCRv6_small_det.mnn

# MNN/PaddleOCR 识别模型路径；OpenVINO-only 配置可设为 null 或省略
rec_model: models/PP-OCRv6_small_rec.mnn

# PaddleOCR 字符集路径
charset: models/ppocr_keys_v6_small.txt

# OCR 最低置信度，低于该值的结果会被过滤
min_confidence: 0.9

# OCR 线程数
threads: 4

# 单次 OCR 请求从入队到返回的最长时间，单位毫秒
request_timeout_ms: 10000

# 关闭时等待底层 OCR 推理退出的最长时间，单位毫秒
shutdown_timeout_ms: 5000

# OCR 后端优先级；可用值: cuda, vulkan, opencl, openvino, cpu。默认只使用 CPU OCR；
# 选择 openvino 时必须配置下方模型路径。引擎逐个尝试、失败自动回退到下一个。
backend_priority:
  - cpu

# OpenVINO IR 模型配置。默认 EXE 已包含 OpenVINO 适配器，但只在
# backend_priority 选择 openvino 时检查运行时 DLL 和这些模型文件。
openvino:
  det_model: null
  det_weights: null
  rec_model: null
  rec_weights: null
  device: CPU

  # OpenVINO GPU/CPU 编译缓存；首次启动会预热聊天 OCR 的固定形状，后续启动可避免重复编译。
  # 设置为 null 可关闭缓存。
  cache_dir: data/openvino-cache

# 检测模型最长边限制；保持 960 与 PaddleOCR/BetterGI 常用配置一致
det_max_side_len: 960

# 检测分割阈值；越低越容易检出细小文字，也更容易产生噪声框
det_score_threshold: 0.3

# 文本框外扩比例；2.0 更接近 BetterGI，减少裁掉边缘字符
det_unclip_ratio: 2.0

# 最小文本框面积；小聊天文字用较低值，避免漏掉短命令
det_min_area: 9

# OCR 库额外裁剪边框；BetterGI 主要依赖 unclip 外扩，这里关闭额外扩边
det_box_border: 0

# 聊天区缩略图平均像素差超过该值时认为画面有变化
change_mean_threshold: 6.0

# 聊天区缩略图变化像素比例超过该值时认为画面有变化
change_pixel_threshold: 0.03

# 聊天标志右侧到文本区域的间距
text_left_gap: 8

# 聊天消息块顶部向上扩展像素
block_top_padding: 2

# 聊天消息块底部向上收缩像素，避免吃到下一条标志
block_bottom_padding: 2

# 单条聊天消息 OCR 块最大高度
max_block_height: 120

# OCR 结果合并为同一行的 Y 轴容差
same_line_y_tolerance: 10

# 聊天标志去重 X 轴容差
marker_dedupe_x: 8

# 聊天标志去重 Y 轴容差
marker_dedupe_y: 8

# 判定下一条聊天标志的最小 Y 轴间隔
next_marker_min_gap: 12

# 聊天文本区域右侧留白
right_padding: 4

# 实验性：将聊天块拼接为单张图片一次性 OCR，减少推理次数
batch_recognize: false